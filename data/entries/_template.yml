# Copy to data/entries/<slug>.yml, where <slug> is the name in lowercase with
# runs of other characters replaced by "-" (e.g. "llama.cpp" -> llama-cpp.yml).
# Then run: python3 scripts/validate.py && python3 scripts/build_readme.py
#
# Required
name: Example DB
url: https://github.com/example/example-db
category: vector-databases          # an id from data/categories.yml
kind: software                      # software (default), model, dataset, learning, community
description: One factual sentence that ends with a period.
proprietary: false                  # true if not open source; renders (`⊘ Proprietary`)
added: '2026-10-23'
#
# Optional: fill in only what you have checked yourself
license: Apache-2.0                 # SPDX id
language: Go
self_host: [docker, binary]         # docker, binary, desktop-app, pip, npm, helm, source
hardware: [cpu, nvidia, apple]      # cpu, nvidia, amd, intel, apple, edge
offline_capable: true
openai_compatible_api: false
commercial_use_ok: true
last_verified: '2026-10-23'         # date you installed and ran it
verified_by: '@your-github-handle'
verified_on: M2 MacBook Air 16 GB   # hardware you ran it on
